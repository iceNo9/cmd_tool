name: Build Flet App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  UV_PYTHON: "3.13"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Verify version consistency
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PYPROJECT_VER=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$PYPROJECT_VER" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT_VER) != tag (${{ steps.version.outputs.VERSION }})"
            exit 1
          fi
          echo "Version consistency OK: $PYPROJECT_VER"

      - name: Inject version
        shell: bash
        run: |
          uv run python -c "
          import re
          from pathlib import Path

          version = '${{ steps.version.outputs.VERSION }}'
          path = Path('utils/version.py')

          content = path.read_text(encoding='utf-8')
          content = re.sub(
              r'^__version__ = .*$',
              f'__version__ = \"{version}\"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          path.write_text(content, encoding='utf-8')

          print('=== utils/version.py after injection ===')
          print(content)
          "

      - name: Build app
        run: |
          uv run flet build windows --yes --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: build/windows
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: windows-build

      - name: Create release archive
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          cd windows-build
          zip -r "../CMDTools-${GITHUB_REF_NAME}-${TIMESTAMP}-windows.zip" .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: CMDTools-${{ github.ref_name }}-*-windows.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}